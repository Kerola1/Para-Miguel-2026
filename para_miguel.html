<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f0e8"><title>Una carta para Miguel 💌</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f0e8;color:#533b42;font-family:Georgia,'Times New Roman',serif}.wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 18px;text-align:center;overflow:hidden;position:relative}.stage{display:flex;flex-direction:column;align-items:center;gap:17px;width:100%;max-width:390px}.fade{animation:rise .6s ease both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font:11px system-ui,sans-serif;letter-spacing:3px;color:#a16e78}.title{font-size:clamp(25px,7vw,30px);font-weight:bold}.sub{font-size:14px;color:#896d73}button{cursor:pointer}.env{position:relative;width:min(240px,75vw);height:155px;background:#e7b8b9;border:0;border-radius:5px;box-shadow:0 10px 24px #79544b30;overflow:hidden;margin-top:16px;transition:transform .2s}.env:hover{transform:translateY(-3px)}.env:before{content:"";position:absolute;inset:0;background:#f4d0ce;clip-path:polygon(0 0,50% 64%,100% 0)}.env:after{content:"";position:absolute;inset:0;background:#eabfc0;clip-path:polygon(0 100%,50% 43%,100% 100%)}.seal{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:2;background:#a95168;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:white;font-size:22px}.hint{font-size:13px;color:#94626f}.sheet{background:#fffaf3;border:1px solid #e9d8cc;border-radius:10px;box-shadow:0 10px 30px #79544b25;padding:25px 22px;max-width:340px;width:100%}.btn{border:0;border-radius:30px;background:#a95168;color:white;padding:13px 21px;font:600 13px system-ui,sans-serif;min-height:44px}.btn:focus-visible,.env:focus-visible,.link:focus-visible{outline:3px solid #794052;outline-offset:4px}.letter{font-size:14px;line-height:1.9;margin:18px 0}.miss{font-style:italic;color:#a95168;font-size:18px}.sign{font-style:italic;color:#a95168;font-size:17px}.link{border:0;background:transparent;color:#94626f;text-decoration:underline;font-size:13px;padding:12px}.beat{display:inline-block;animation:heartbeat 1.4s infinite}@keyframes heartbeat{50%{transform:scale(1.15)}}.kisses{font-size:24px;min-height:42px;margin:16px 0;overflow-wrap:anywhere}.heart{position:absolute;pointer-events:none;font-size:25px;animation:float 1.5s ease-out forwards}@keyframes float{to{transform:translateY(-135px) rotate(22deg);opacity:0}}@media(prefers-reduced-motion:reduce){.fade,.beat,.heart{animation:none}.env{transition:none}}
</style></head><body><main class="wrap" id="card"><section class="stage fade" id="stage" aria-live="polite"></section></main>
<script>
(()=>{const stage=document.getElementById('stage'),card=document.getElementById('card');let page=0,count=0;function shower(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<9;i++){const el=document.createElement('span');el.className='heart';el.textContent=['💕','💋','♥','💗'][i%4];el.style.left=(15+Math.random()*70)+'%';el.style.top=(45+Math.random()*40)+'%';el.style.animationDelay=(i*.1)+'s';card.appendChild(el);setTimeout(()=>el.remove(),2600)}}function render(){stage.classList.remove('fade');void stage.offsetWidth;stage.classList.add('fade');if(page===0){stage.innerHTML=`<div class="eyebrow">SPECIAL DELIVERY · WITH LOVE</div><div class="title">Miguel, tienes una carta 💌</div><div class="sub">Un poquito de amor viajó hasta ti...</div><button class="env" id="open" aria-label="Abrir el sobre"><span class="seal">♥</span></button><div class="hint">Toca el sobre, cumpleañero guapo 😘</div>`;document.getElementById('open').onclick=()=>{page=1;render();shower()}}else if(page===1){stage.innerHTML=`<article class="sheet"><div style="font-size:35px">🎂</div><div class="eyebrow" style="letter-spacing:2px;margin-top:14px">TO MY FAVORITE PERSON</div><div style="font-size:29px;margin:17px 0">Happy Birthday,<br>Miguel ♡</div><div class="letter">Aunque hoy nos separen los kilómetros, quiero que sepas que estás presente en mis pensamientos y en mi corazón.<br><br>Ojalá pudiera estar ahí para abrazarte, llenarte de besos y celebrar contigo, lindo. Mientras llega ese momento, te mando un pedacito de mí en esta carta.<br><br>Que este nuevo año de vida te regale muchas razones para sonreír. Y aunque hoy no pueda darte un beso en persona, te mando muchísimos desde aquí.<br><br><span class="miss">I miss you, guapo. ❤️</span></div><div class="sign">Con mucho amor,<br>tu novia 💋</div></article><button class="btn" id="surprise">Hay una sorpresa para ti →</button>`;document.getElementById('surprise').onclick=()=>{page=2;render();shower()}}else{stage.innerHTML=`<div class="eyebrow">ONE MORE THING...</div><article class="sheet"><div class="beat" style="font-size:60px;margin:12px">💝</div><div style="font-size:26px;margin:14px 0">Un abrazo para Miguel</div><div style="font-size:15px;line-height:1.8">Este corazón viene cargado de besos, abrazos y todos esos momentos que todavía nos quedan por compartir.<br><br><span class="miss">I miss you, guapo. 💕</span></div><div class="kisses" id="kisses">♡</div><button class="btn" id="kiss">Toca para recibir un beso 💋</button></article><button class="link" id="restart">Volver a abrir la carta</button>`;document.getElementById('kiss').onclick=()=>{count++;document.getElementById('kisses').textContent='💋'.repeat(Math.min(count,8));shower()};document.getElementById('restart').onclick=()=>{page=0;count=0;render()}}}render()})();
</script></body></html>
